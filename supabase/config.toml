# Public code-request and code-exchange endpoints run before a user has a JWT.
# Their handlers enforce origin, input validation, and rate limits.
[functions.send-verification]
verify_jwt = false

[functions.verify-code]
verify_jwt = false

# assessment keeps the platform JWT gate and validates the user in its handler.
[functions.assessment]
verify_jwt = true

# submit-lead is a public lead-capture endpoint: no user JWT exists at form
# time. Its handler enforces origin, honeypot, and input validation.
[functions.submit-lead]
verify_jwt = false

# One-time scanner tokens are checked in the handler.
[functions.website-scorecard]
verify_jwt = false
