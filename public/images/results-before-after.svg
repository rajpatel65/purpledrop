<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="rd-title rd-desc">
  <title id="rd-title">Before and after: the actual AI answer about your company</title>
  <desc id="rd-desc">Two side-by-side AI assistant answers. On the day purpleDrop starts, the assistant names three competitors and not your company. Three weeks later, the same question returns your company as the first recommendation.</desc>

  <!-- canvas -->
  <rect width="1600" height="900" fill="#FAF6EF"/>
  <g stroke="#E7E0D2" stroke-width="1" opacity="0.55">
    <line x1="0" y1="0" x2="0" y2="900"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
    <line x1="1600" y1="0" x2="1600" y2="900"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
  </g>

  <!-- eyebrow -->
  <text x="80" y="96" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" font-weight="700" letter-spacing="3" fill="#6D28D9">THE PROOF WE SHOW EVERY CLIENT</text>
  <text x="1520" y="96" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" letter-spacing="1.5" fill="#A39A87">THE ACTUAL ANSWER — BEFORE &amp; AFTER</text>

  <!-- ============ LEFT PANEL : BEFORE ============ -->
  <rect x="80" y="150" width="700" height="640" rx="24" fill="#F3ECDF" stroke="#E7E0D2"/>
  <rect x="80" y="150" width="700" height="8" rx="4" fill="#D9D2C2"/>

  <!-- window chrome -->
  <circle cx="112" cy="196" r="7" fill="#FCA5A5"/>
  <circle cx="136" cy="196" r="7" fill="#FCD34D"/>
  <circle cx="160" cy="196" r="7" fill="#6EE7B7"/>
  <text x="188" y="201" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#5C564B">YOUR BUYER'S AI ASSISTANT</text>
  <text x="750" y="201" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#A39A87">BEFORE · DAY 0</text>

  <!-- user bubble -->
  <rect x="340" y="222" width="410" height="118" rx="16" fill="#F3E8FF"/>
  <text x="370" y="256" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1A1815">
    <tspan x="370" dy="0">We need a commercial lawyer in</tspan>
    <tspan x="370" dy="29">Charlotte who handles M&amp;A for</tspan>
    <tspan x="370" dy="29">manufacturers. Who should we talk to?</tspan>
  </text>

  <!-- assistant reply -->
  <text x="110" y="398" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#5C564B">Here are three firms worth contacting:</text>

  <g>
    <circle cx="132" cy="438" r="13" fill="#F3E8FF"/>
    <text x="132" y="443" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#6D28D9">1</text>
    <text x="158" y="444" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#1A1815">Hartley &amp; Shaw LLP</text>
    <text x="158" y="468" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#A39A87">Clear service pages, recent M&amp;A deals</text>
  </g>
  <g>
    <circle cx="132" cy="510" r="13" fill="#F3E8FF"/>
    <text x="132" y="515" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#6D28D9">2</text>
    <text x="158" y="516" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#1A1815">Crawford &amp; Byrne</text>
    <text x="158" y="540" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#A39A87">Manufacturing sector wins, client quotes on site</text>
  </g>
  <g>
    <circle cx="132" cy="582" r="13" fill="#F3E8FF"/>
    <text x="132" y="587" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#6D28D9">3</text>
    <text x="158" y="588" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#1A1815">The Aldrich Partnership</text>
    <text x="158" y="612" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#A39A87">Consistent listings across three directories</text>
  </g>

  <!-- signal box -->
  <rect x="110" y="656" width="640" height="104" rx="12" fill="#6D28D9" fill-opacity="0.05" stroke="#6D28D9" stroke-dasharray="7 6"/>
  <text x="136" y="692" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="700" letter-spacing="2" fill="#6D28D9">YOUR COMPANY ISN'T IN THE ANSWER</text>
  <text x="136" y="724" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5C564B">And you never knew the question was asked.</text>

  <!-- ============ RIGHT PANEL : AFTER ============ -->
  <rect x="820" y="150" width="700" height="640" rx="24" fill="#FFFCF6" stroke="#E7E0D2"/>
  <rect x="820" y="150" width="700" height="8" rx="4" fill="#6D28D9"/>

  <!-- window chrome -->
  <circle cx="852" cy="196" r="7" fill="#FCA5A5"/>
  <circle cx="876" cy="196" r="7" fill="#FCD34D"/>
  <circle cx="900" cy="196" r="7" fill="#6EE7B7"/>
  <text x="928" y="201" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#5C564B">YOUR BUYER'S AI ASSISTANT</text>
  <text x="1490" y="201" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#6D28D9">AFTER · WEEK 3</text>

  <!-- user bubble -->
  <rect x="1080" y="222" width="410" height="118" rx="16" fill="#F3E8FF"/>
  <text x="1110" y="256" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1A1815">
    <tspan x="1110" dy="0">We need a commercial lawyer in</tspan>
    <tspan x="1110" dy="29">Charlotte who handles M&amp;A for</tspan>
    <tspan x="1110" dy="29">manufacturers. Who should we talk to?</tspan>
  </text>

  <!-- assistant reply -->
  <text x="850" y="398" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#5C564B">Here are three firms worth contacting:</text>

  <g>
    <circle cx="872" cy="438" r="13" fill="#6D28D9"/>
    <text x="872" y="443" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <text x="898" y="444" font-family="Fraunces, 'Times New Roman', Georgia, serif" font-size="25" font-weight="700" fill="#6D28D9">Your Company</text>
    <text x="898" y="468" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#5C564B">Published M&amp;A focus, verified sources, clear fees</text>
  </g>
  <g>
    <circle cx="872" cy="510" r="13" fill="#F3E8FF"/>
    <text x="872" y="515" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#6D28D9">2</text>
    <text x="898" y="516" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#1A1815">Hartley &amp; Shaw LLP</text>
    <text x="898" y="540" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#A39A87">Clear service pages, recent M&amp;A deals</text>
  </g>
  <g>
    <circle cx="872" cy="582" r="13" fill="#F3E8FF"/>
    <text x="872" y="587" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#6D28D9">3</text>
    <text x="898" y="588" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#1A1815">Crawford &amp; Byrne</text>
    <text x="898" y="612" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#A39A87">Manufacturing sector wins, client quotes</text>
  </g>

  <!-- signal box -->
  <rect x="850" y="656" width="640" height="104" rx="12" fill="#6D28D9" fill-opacity="0.07" stroke="#6D28D9"/>
  <text x="876" y="692" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" font-weight="700" letter-spacing="2" fill="#6D28D9">THE SAME QUESTION, THREE WEEKS LATER</text>
  <text x="876" y="724" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#1A1815">Your company is the first name the answer gives.</text>

  <!-- footnotes -->
  <text x="80" y="852" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" letter-spacing="1" fill="#5C564B">ChatGPT · Claude · Gemini · Perplexity · Copilot — the question your buyers actually ask</text>
  <text x="1520" y="852" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#A39A87">Illustrative — your report shows your actual answers.</text>
</svg>
